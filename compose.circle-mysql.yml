# Real MySQL 8.4 in a named volume, separate from Homebrew's old data.
# Credentials are read from the uncommitted .env file; no passwords in Git.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Add DB_NAME to your local .env}
      MYSQL_USER: ${DB_USER:?Add DB_USER to your local .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Add DB_PASSWORD to your local .env}
      MYSQL_ROOT_PASSWORD: ${CIRCLE_MYSQL_ROOT_PASSWORD:?Add CIRCLE_MYSQL_ROOT_PASSWORD to your local .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - circle_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp --host=127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  circle_mysql_data:
