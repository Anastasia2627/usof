name: Circle Basic minimum check

on:
  push:
    branches: [circle-basic-minimal]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: usof_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: usof_ci
      DB_USER: root
      DB_PASSWORD: root
      AUTH_SECRET: ci-only-secret-not-for-production
      CLIENT_ORIGIN: http://localhost:5173
      APP_PORT: 5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check backend syntax
        run: npm run check:backend
      - name: Check SMTP script syntax
        run: node --check scripts/check-smtp.mjs
      - name: Run existing authentication and verification tests
        run: |
          npm run db:reset
          npm run test:auth
      - name: Start MySQL-backed API
        run: |
          npm start > api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat api.log
          exit 1
      - name: Verify all Basic and Creative backend flows
        run: npm run test:smoke
      - name: Check registration, resend and email confirmation
        run: npm run test:email:integration
      - name: Build frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start React frontend
        run: |
          npm run web -- --host 0.0.0.0 > web.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat web.log
          exit 1
      - name: Test functional UI at 390px and on admin pages
        run: npm run test:ui
      - name: Capture desktop and mobile Basic screenshots
        run: |
          mkdir -p screenshots
          npx playwright screenshot --browser chromium --viewport-size="1280,800" --wait-for-timeout=1200 --full-page "http://localhost:5173/#/" screenshots/basic-desktop.png
          npx playwright screenshot --browser chromium --viewport-size="390,844" --wait-for-timeout=1200 --full-page "http://localhost:5173/#/" screenshots/basic-mobile.png
      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: circle-basic-screenshots
          path: screenshots/*.png
          retention-days: 7
      - name: Print service logs on failure
        if: failure()
        run: |
          cat api.log 2>/dev/null || true
          cat web.log 2>/dev/null || true
