name: Circle branch build check

on:
  push:
    branches: [circle-product-cleanup]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check backend syntax
        run: npm run check:backend
      - name: Check SMTP script syntax
        run: node --check scripts/check-smtp.mjs
      - name: Build frontend
        run: npm run build
